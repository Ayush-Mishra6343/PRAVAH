services:
  - type: web
    name: pravah-crisis-intelligence
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_BACKUP_API_KEY
        sync: false
